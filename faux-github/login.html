<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in to GitHub · GitHub (faux site de test)</title>
  <meta name="user-login" content="">
  <style>
    body { font-family: system-ui, sans-serif; background: #fff; display: flex; flex-direction: column; align-items: center; margin-top: 3rem; }
    h1 { font-weight: 300; font-size: 1.5rem; }
    form { background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 6px; padding: 1.2rem; width: 300px; }
    label { display: block; margin: .6rem 0 .3rem; font-size: .9rem; }
    input[type=text], input[type=password] { width: 100%; padding: .4rem; border: 1px solid #d0d7de; border-radius: 6px; box-sizing: border-box; }
    input[type=submit] { margin-top: 1rem; width: 100%; padding: .5rem; background: #1f883d; color: #fff; border: 0; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .flash-error { background: #ffebe9; border: 1px solid #ff818266; border-radius: 6px; padding: .6rem 1rem; margin-bottom: 1rem; width: 300px; box-sizing: border-box; }
    .note { margin-top: 1rem; font-size: .75rem; color: #6e7781; }
  </style>
</head>
<body>
  <h1>Sign in to GitHub</h1>
  <div id="js-flash-container"></div>
  <form id="login-form" novalidate>
    <label for="login_field">Username or email address</label>
    <input type="text" name="login" id="login_field" autocomplete="username">
    <label for="password">Password</label>
    <input type="password" name="password" id="password" autocomplete="current-password">
    <input type="submit" name="commit" value="Sign in">
  </form>
  <p class="note">Faux site de connexion utilisé uniquement par les tests (aucun lien avec GitHub).</p>

  <script type="module">
    import { verifier } from '/auth.js';

    const CLE_ECHECS = 'faux-github-echecs';          // échecs consécutifs, gardés le temps de l'onglet

    document.getElementById('login-form').addEventListener('submit', (evenement) => {
      evenement.preventDefault();
      const echecs = Number(sessionStorage.getItem(CLE_ECHECS) || 0);
      const resultat = verifier({
        identifiant: document.getElementById('login_field').value,
        motDePasse: document.getElementById('password').value,
        echecs,
      });
      if (resultat.statut === 'ok') {
        sessionStorage.removeItem(CLE_ECHECS);
        sessionStorage.setItem('faux-github-user', resultat.utilisateur);
        location.href = '/dashboard';
        return;
      }
      sessionStorage.setItem(CLE_ECHECS, String(echecs + 1));
      const zone = document.getElementById('js-flash-container');
      zone.replaceChildren();
      const message = document.createElement('div');
      message.className = 'flash flash-error';
      message.textContent = resultat.message;
      zone.append(message);
    });
  </script>
</body>
</html>
