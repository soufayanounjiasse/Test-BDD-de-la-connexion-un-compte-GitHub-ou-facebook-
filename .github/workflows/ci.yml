# Les tests se lancent à CHAQUE push (toutes les branches) et à chaque pull request.
#  - job "tests"     : tests unitaires + couverture (quality gate) + tests BDD
#  - job "mutation"  : test de mutation (StrykerJS, équivalent de PIT) ; le job échoue sous le seuil de 80 %
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests unitaires et couverture (Vitest, seuils de couverture)
        run: npm run test:unit

      - name: Installer le navigateur Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests BDD (Cucumber + Playwright)
        run: npm run test:bdd

      - name: Publier les rapports de tests et de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: reports/
          if-no-files-found: ignore

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test de mutation (StrykerJS)
        run: npm run test:mutation

      - name: Publier le rapport de mutation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-mutation
          path: reports/mutation/
          if-no-files-found: ignore
